const n2 = n => (n===null||n===undefined)?'—':n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pf = n => (n===null||n===undefined)?'—':(n*100).toFixed(1)+'%';
const sf = n => (n===null||n===undefined)?'—':(n>=0?'+':'')+(n*100).toFixed(1)+'%';
const pp = n => (n===null||n===undefined)?'—':(n>=0?'+':'')+(n*100).toFixed(1)+'pp';
function fmt(c,v){
  if(v===null||v===undefined) return '<span class="na">—</span>';
  if(c.f==='money') return nf(v);
  if(c.f==='rate') return pf(v);
  if(c.f==='pct') return sf(v);
  if(c.f==='pp') return pp(v);
  return v;
}
// 三档配色：≥时间进度 绿；≥时间进度的一半 黄；＜一半 红
function tierCls(v,tp){
  if(v==null||!tp) return '';
  if(v>=tp) return 'good';
  if(v>=tp/2) return 'warn';
  return 'bad';
}
function cellCls(c,v){
  if(c.judge && v!=null) return tierCls(v, c.judge==='sales'?D.meta.sales_tp:D.meta.gross_tp);
  if(c.f==='pct'||c.f==='pp') return v===null?'':(v>=0?'pos':'neg');
  return '';
}
function rowsOf(){
  const R=D.dims[dim].rows.slice();
  const kw=q.trim();
  const out = kw? R.filter(r=>(r.name+' '+r.sub).toLowerCase().includes(kw.toLowerCase())) : R;
  out.sort((a,b)=>{const x=a[sk],y=b[sk];
    if(x==null)return 1; if(y==null)return -1;
    return (x>y?1:x<y?-1:0)*sd*(sk==='name'?-1:1);
  });
  return out;
}
function render(){
  const meta=D.meta, k=D.kpi;
  document.getElementById('dimTitle').textContent=D.dims[dim].label;
  const list=rowsOf();
  document.getElementById('cnt').textContent=list.length+' 项 · 全组共 '+D.dims[dim].rows.length+' 项';
  const cols=COLS.filter(c=>(c.g==='base'||on.has(c.g))&&(!c.only||c.only===dim));
  let h='<tr>'+cols.map(c=>{
    const cls=(c.k===sk?'sorted ':'')+(c.left?'l':'');
    const ar=c.k===sk?(sd>0?'▲':'▼'):'⇅';
    return '<th class="'+cls+'" data-k="'+c.k+'">'+c.t+(c.u?'<span class="u">'+c.u+'</span>':'')+'<span class="ar">'+ar+'</span></th>';
  }).join('')+'</tr>';
  document.getElementById('thead').innerHTML=h;
  const body=list.map(r=>{
      const key=dim+'|'+r.name;
      const kids=r.kids||[];
      const has=kids.length>0;
      const isOpen=has&&open.has(key);
      let tr='<tr>'+cols.map(c=>{
        if(c.k==='name') return '<td><span class="nm'+(has?' ex':'')+'"'+(has?' data-key="'+key+'"':'')+'>'+
          '<span class="caret">'+(has?(isOpen?'▼':'▶'):'')+'</span>'+r.name+'</span>'+
          (r.sub?'<span class="sb">'+r.sub+'</span>':'')+'</td>';
        return '<td class="'+cellCls(c,r[c.k])+'">'+fmt(c,r[c.k])+'</td>';
      }).join('')+'</tr>';
      if(isOpen){
        tr+='<tr class="det"><td colspan="'+cols.length+'">'+
          '<div class="hd">'+r.name+' 包含 <b>'+kids.length+'</b> 个三级分类（数字＝销售额达成率 / 毛利额达成率）</div>'+
          '<div class="kidwrap">'+kids.map(x=>'<span class="kid '+tierCls(x.sr,D.meta.sales_tp)+'">'+x.n+
            '<em>'+pf(x.sr)+' / '+pf(x.gr)+'</em></span>').join('')+'</div>'+
          '</td></tr>';
      }
      return tr;
    }).join('');
  document.getElementById('tbody').innerHTML=body || '<tr><td colspan="'+cols.length+'" style="text-align:center;color:#94a3b8;padding:26px">没有匹配的数据</td></tr>';
  document.querySelectorAll('.nm.ex[data-key]').forEach(el=>el.onclick=()=>{
    const key=el.dataset.key;
    if(open.has(key)) open.delete(key); else open.add(key);
    render();
  });
  const t=D.dims[dim].total;
  document.getElementById('tfoot').innerHTML='<tr>'+cols.map(c=>{
      if(c.k==='name') return '<td>合计<span class="sb">全组 '+meta.total+' 条明细</span></td>';
      return '<td>'+fmt(c,t[c.k])+'</td>';
    }).join('')+'</tr>';
  document.querySelectorAll('#thead th').forEach(th=>th.onclick=()=>{
    const k2=th.dataset.k; if(k2===sk) sd=-sd; else {sk=k2; sd=k2==='name'?1:-1;} render();
  });
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.d===dim));
  document.getElementById('sideS').textContent=(meta.sales_tp*100).toFixed(1)+'%';
  document.getElementById('sideG').textContent=(meta.gross_tp*100).toFixed(1)+'%';
}
function renderKpi(){
  const k=D.kpi, m=D.meta;
  const sr=k.t.sa/k.t.st, gr=k.t.ga/k.t.gt;
  const sd=(sr-m.sales_tp)*100, gd=(gr-m.gross_tp)*100;
  const card=(lb,vl,cls,ex)=>'<div class="kpi"><div class="lb">'+lb+'</div><div class="vl '+cls+'">'+vl+'</div><div class="ex">'+ex+'</div></div>';
  document.getElementById('kpis').innerHTML=
    card('销售额达成率', pf(sr), tierCls(sr, m.sales_tp),
         '销售额时间进度 <b>'+pf(m.sales_tp)+'</b>（T-2，截止 '+m.sales_cut.slice(5)+'）<br>'+
         '与时间进度差 <b class="'+(sd>=0?'good':'bad')+'">'+(sd>=0?'+':'')+sd.toFixed(1)+'pp</b>')+
    card('毛利额达成率', pf(gr), tierCls(gr, m.gross_tp),
         '毛利时间进度 <b>'+pf(m.gross_tp)+'</b>（每周六取数，最新 '+m.gross_cut.slice(5)+' → '+m.gross_day+'/'+m.month_days+'）<br>'+
         '与时间进度差 <b class="'+(gd>=0?'good':'bad')+'">'+(gd>=0?'+':'')+gd.toFixed(1)+'pp</b>')+
    card('毛利率', pf(k.gm_a), k.gm_a>=k.gm_t?'good':'bad',
         '目标毛利率 '+pf(k.gm_t)+'<br>'+
         '实际'+(k.gm_a>=k.gm_t?'高于':'低于')+'目标 <b>'+Math.abs((k.gm_a-k.gm_t)*100).toFixed(1)+'pp</b>')+
    card('同环比（基数 = 对比月全月 × '+pf(m.sales_tp)+'）',
         '同比 '+sf(k.sp_yoy_sa)+' <small>/ 环比 '+sf(k.sp_mom_sa)+'</small>',
         (k.sp_yoy_sa||0)>=0?'good':'bad',
         '同比：销售 <b>'+sf(k.sp_yoy_sa)+'</b> · 毛利 <b>'+sf(k.sp_yoy_ga)+'</b> · 毛利率 <b>'+pp(k.sp_yoy_gm_pp)+'</b><br>'+
         '环比：销售 <b>'+sf(k.sp_mom_sa)+'</b> · 毛利 <b>'+sf(k.sp_mom_ga)+'</b>');
}
function renderChips(){
  document.getElementById('groups').innerHTML=GROUPS.map(g=>
    '<span class="chip '+(on.has(g.k)?'on':'')+'" data-g="'+g.k+'">'+g.t+'</span>').join('');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const g=c.dataset.g; if(on.has(g)){ if(on.size>1) on.delete(g); } else on.add(g); renderChips(); render();
  });
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{dim=b.dataset.d; render();});
document.getElementById('q').oninput=e=>{q=e.target.value; render();};
document.getElementById('metaBar').innerHTML=
  '<span class="f">平台 <select><option>'+D.meta.platform+'</option></select></span>'+
  '<span class="f">月份 <b>'+D.meta.month+'</b></span>'+
  '<span class="f">国家 <b>'+D.meta.country+'</b></span>'+
  '<span class="f">业务组 <b>'+D.meta.biz+'</b></span>'+
  '<span class="f">口径日 <b>'+D.meta.rd+'</b></span>'+
  '<span class="f">数据源 <b>目标完成进度</b></span>'+
  '<span class="f">同比基数 <b>2025-11 全月</b></span>'+
  '<span class="f">快照 <b>'+D.meta.snapshot+'</b></span>';
document.getElementById('note').innerHTML=
  '<b>口径：</b>金额 MXN（原表 CNY × '+D.meta.fx.toFixed(3)+'）；达成率 = Σ达成 ÷ Σ目标；'+
  '<b>时间进度：</b>销售额截止 <b>T-2（'+D.meta.sales_cut.slice(5)+'）</b>→ <b>'+D.meta.sales_day+'/'+D.meta.month_days+' = '+pf(D.meta.sales_tp)+'</b>；'+
  '毛利额<b>每周六取数</b>，最新快照 <b>'+D.meta.gross_cut.slice(5)+'</b> → <b>'+D.meta.gross_day+'/'+D.meta.month_days+' = '+pf(D.meta.gross_tp)+'</b>。'+
  '两张达成率分别对照各自基准判红绿，基准不是 100%。<b class="warn">若 BI 达成额尚未更新到该截止日，达成率会被低估</b>——本期按 10 月日均实测反推约 '+pf(D.meta.eff_tp)+'。<br>'+
  '<b>配色（三档）：</b>达成率 <b style="color:#15803d">≥ 时间进度 → 绿色</b>；<b style="color:#a16207">≥ 时间进度的一半 → 黄色</b>；<b style="color:#b91c1c">＜ 时间进度的一半 → 红色</b>。'+
  '本期销售基准 '+pf(D.meta.sales_tp)+'（黄线 '+pf(D.meta.sales_tp/2)+'）、毛利基准 '+pf(D.meta.gross_tp)+'（黄线 '+pf(D.meta.gross_tp/2)+'）。<br>'+
  '<b>同环比（同一时间进度，按你给的公式）：</b>'+
  '同比 =（本期累计达成 − 去年同月<b>全月</b>达成 × 时间进度）÷（去年同月全月达成 × 时间进度）；'+
  '环比 =（本期累计达成 − 上月<b>全月</b>达成 × 时间进度）÷（上月全月达成 × 时间进度）。'+
  '销售额用 T-2 时间进度 <b>'+D.meta.sales_day+'/'+D.meta.month_days+' = '+pf(D.meta.sales_tp)+'</b>，毛利额用最新周六 <b>'+D.meta.gross_day+'/'+D.meta.month_days+' = '+pf(D.meta.gross_tp)+'</b>。<br>'+
  '<b>基数（CNY 原值，便于与 BI 逐位核对）：</b>本期 2026-11 销售 <b>'+n2(D.meta.base_cur_rev)+'</b>、毛利 <b>'+n2(D.meta.base_cur_gp)+'</b>；'+
  '上月 2026-10 全月 销售 '+n2(D.meta.base_prev_rev)+'、毛利 '+n2(D.meta.base_prev_gp)+'；'+
  '去年 2025-11 全月 销售 '+n2(D.meta.base_ly_rev)+'、毛利 '+n2(D.meta.base_ly_gp)+'。'+
  '例：销售额同比 =（'+n2(D.meta.base_cur_rev)+' − '+n2(D.meta.base_ly_rev)+'×'+pf(D.meta.sales_tp)+'）÷（'+n2(D.meta.base_ly_rev)+'×'+pf(D.meta.sales_tp)+'）。'+
  '<b>环比算式：</b>销售 =（'+n2(D.meta.base_cur_rev)+' − '+n2(D.meta.base_prev_rev)+'×'+pf(D.meta.sales_tp)+'）÷（'+n2(D.meta.base_prev_rev)+'×'+pf(D.meta.sales_tp)+'）'+
  ' = '+sf(D.kpi.sp_mom_sa)+'；毛利 =（'+n2(D.meta.base_cur_gp)+' − '+n2(D.meta.base_prev_gp)+'×'+pf(D.meta.gross_tp)+'）÷（'+n2(D.meta.base_prev_gp)+'×'+pf(D.meta.gross_tp)+'）'+
  ' = '+sf(D.kpi.sp_mom_ga)+'。<br>'+
  '<b>毛利率口径：</b>「26年毛利率达成」= 本期毛利达成 ÷ 本期销售达成；「25年毛利率达成」= 去年同月<b>全月</b>毛利率（基数同乘时间进度，比例不变），两者之差即毛利率同比。<br>'+
  '<b>数据源：</b>全部金额与比率取自帆软 BI <b>「目标完成进度(权限版)」</b>，' + D.meta.total + ' 条明细；' +
  '同比基期 2025-11 全月由同一报表按月补拉（pull_yoy_full.py），与本期同源同口径。<br>'+
  '<b>「达成 ÷ BU目标」（仅三级分类维度）：</b>该三级分类的达成 ÷ 其<b>所属 BU 的目标</b>，用来判断单个类目对 BU 目标的贡献度。' +
  '例：宠物毯属宠物用品BU → 宠物毯销售额达成 ÷ 宠物用品BU销售额目标。分母是整个 BU 的目标、不是类目自己的目标，所以数值通常远小于同一行的「达成率」。<br>'+
  '<b>映射口径：</b>负责人归属严格按桌面「墨西哥 项目负责人.xlsx」' + D.meta.mapped + ' 条（按三级分类关联）；' +
  'BU / 产品组以 BI 在「拉美收纳宠户组」筛选下的结果为准' +
  (D.meta.conflict.length
    ? '，因此 ' + D.meta.conflict.join('、') + ' 归入 ' + D.meta.conflict_bu.join('/') +
      '（映射表原写家具BU，按确认口径不采用）。'
    : '。') + '<br>'+
  '<b>映射覆盖：</b>映射表 ' + D.meta.mapped + ' 条' +
  (D.meta.extra_mapped ? ' + 脚本补充 ' + D.meta.extra_mapped + ' 条（Excel 未收录）' : '') +
  '，关联本期 ' + D.meta.lv3 + ' 个三级类目' +
  (D.meta.unmapped.length
    ? '，其中 <b class="warn">' + D.meta.unmapped.length + ' 个未映射（' + D.meta.unmapped.join('、') +
      '，销售目标合计 ' + nf(D.meta.unmapped_st) + ' MXN）</b>，在负责人维度显示为「未分配」。'
    : '，100% 覆盖。');
renderKpi(); renderChips(); render();
</script>
</body></html>
