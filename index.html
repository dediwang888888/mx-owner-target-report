function fmt(c,v){
  if(v===null||v===undefined) return '<span class="na">—</span>';
  if(c.f==='money') return nf(v);
  if(c.f==='rate') return pf(v);
  if(c.f==='pct') return sf(v);

function tierCls(v,tp){

  if(v>=tp) return 'good';
  if(v>=tp/2) return 'warn';
  return 'bad';
}
function cellCls(c,v){
  if(c.judge && v!=null) return tierCls(v, c.judge==='sales'?D.meta.sales_tp:D.meta.gross_tp);
