  document.getElementById('cnt').textContent=list.length+' 项 · 全组共 '+M().dims[dim].rows.length+' 项';
  const cols=COLS.filter(c=>(c.g==='base'||on.has(c.g))&&(!c.only||c.only===dim));
  let h='<tr>'+cols.map(c=>{
    const cls=(c.k===sk?'sorted ':'')+(c.left?'l':'');
    const ar=c.k===sk?(sd>0?'▲':'▼'):'⇅';
    const uu=(c.u==='MXN'?D.meta.currency:c.u);
    return '<th class="'+cls+'" data-k="'+c.k+'">'+c.t+(uu?'<span class="u">'+uu+'</span>':'')+'<span class="ar">'+ar+'</span></th>';
  }).join('')+'</tr>';
  document.getElementById('thead').innerHTML=h;
  const body=list.map(r=>{
      const key=mo+'|'+dim+'|'+r.name;
      const kids=r.kids||[];
      const has=kids.length>0;
      const isOpen=has&&open.has(key);
      let tr='<tr>'+cols.map(c=>{
        if(c.k==='name') return '<td><span class="nm'+(has?' ex':'')+'"'+(has?' data-key="'+key+'"':'')+'>'+
          '<span class="caret">'+(has?(isOpen?'▼':'▶'):'')+'</span>'+r.name+'</span>'+
          (r.sub?'<span class="sb">'+r.sub+'</span>':'')+'</td>';
        return '<td class="'+cellCls(c,r[c.k])+'">'+fmt(c,r[c.k])+'</td>';
      }).join('')+'</tr>';
      if(isOpen){
        tr+='<tr class="det"><td colspan="'+cols.length+'">'+
          '<div class="hd">'+r.name+' 包含 <b>'+kids.length+'</b> 个三级分类（数字＝销售额达成率 / 毛利额达成率）</div>'+
          '<div class="kidwrap">'+kids.map(x=>'<span class="kid '+tierCls(x.sr,MT().s)+'">'+x.n+
            '<em>'+pf(x.sr)+' / <span class="kg '+tierCls(x.gr,MT().g)+'">'+pf(x.gr)+'</span></em></span>').join('')+'</div>'+
          '</td></tr>';
      }
      return tr;
    }).join('');
  document.getElementById('tbody').innerHTML=body || '<tr><td colspan="'+cols.length+'" style="text-align:center;color:#94a3b8;padding:26px">没有匹配的数据</td></tr>';
  document.querySelectorAll('.nm.ex[data-key]').forEach(el=>el.onclick=()=>{
    const key=el.dataset.key;
    if(open.has(key)) open.delete(key); else open.add(key);
    render();
  });
  const t=M().dims[dim].total;
  document.getElementById('tfoot').innerHTML='<tr>'+cols.map(c=>{
      if(c.k==='name') return '<td>合计<span class="sb">全组 '+meta.total+' 条明细</span></td>';
      return '<td class="'+cellCls(c,t[c.k])+'">'+fmt(c,t[c.k])+'</td>';
    }).join('')+'</tr>';
  document.querySelectorAll('#thead th').forEach(th=>th.onclick=()=>{
    const k2=th.dataset.k; if(k2===sk) sd=-sd; else {sk=k2; sd=k2==='name'?1:-1;} render();
  });
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.d===dim));
  document.getElementById('sideS').textContent=(MT().s*100).toFixed(1)+'%';
  document.getElementById('sideG').textContent=(MT().g*100).toFixed(1)+'%';
  const mv=document.getElementById('moVal'); if(mv) mv.textContent=mo;
  renderKpi(); renderNote();
}
function renderKpi(){
  const k=M().kpi, m=D.meta;
  const sr=k.t.sa/k.t.st, gr=k.t.ga/k.t.gt;
  const sd=(sr-MT().s)*100, gd=(gr-MT().g)*100;
  const card=(lb,vl,cls,ex)=>'<div class="kpi"><div class="lb">'+lb+'</div><div class="vl '+cls+'">'+vl+'</div><div class="ex">'+ex+'</div></div>';
  document.getElementById('kpis').innerHTML=
    card('销售额达成率', pf(sr), tierCls(sr, MT().s),
         '销售额时间进度 <b>'+pf(MT().s)+'</b>'+(M().base.full?'（完整月）':'（T-2，截止 '+m.sales_cut.slice(5)+'）')+'<br>'+
         '与时间进度差 <b class="'+(sd>=0?'good':'bad')+'">'+(sd>=0?'+':'')+sd.toFixed(1)+'pp</b>')+
    card('毛利额达成率', pf(gr), tierCls(gr, MT().g),
         '毛利时间进度 <b>'+pf(MT().g)+'</b>'+(M().base.full?'（完整月）':'（每周六取数，最新 '+m.gross_cut.slice(5)+' → '+m.gross_day+'/'+m.month_days+'）')+'<br>'+
         '与时间进度差 <b class="'+(gd>=0?'good':'bad')+'">'+(gd>=0?'+':'')+gd.toFixed(1)+'pp</b>')+
    card('毛利率（三 BU 合计）', pf(k.gm_a), k.gm_a>=k.gm_t?'good':'bad',
         'Σ三 BU 毛利额达成 ÷ Σ三 BU 销售额达成<br>'+
         (k.gm_bu||[]).map(b=>b.name.replace('BU','')+' <b>'+pf(b.gm)+'</b>').join(' · ')+'<br>'+
         '目标毛利率 '+pf(k.gm_t)+'，实际'+(k.gm_a>=k.gm_t?'高于':'低于')+' <b>'+Math.abs((k.gm_a-k.gm_t)*100).toFixed(1)+'pp</b>')+
    card('同环比（基数 = 对比月全月 × '+pf(MT().s)+'）',
         (D.meta.has_ly?'同比 '+sf(k.sp_yoy_sa)+' <small>':'同比 —（无基期）<small>')+'/ 环比 '+sf(k.sp_mom_sa)+'</small>',
         ((k.sp_mom_sa||0)>=0?'good':'bad'),
         (D.meta.has_ly
            ? '同比：销售 <b>'+sf(k.sp_yoy_sa)+'</b> · 毛利 <b>'+sf(k.sp_yoy_ga)+'</b> · 毛利率 <b>'+pp(k.sp_yoy_gm_pp)+'</b><br>'
            : '<b class="warn">'+D.meta.country+'在「目标完成进度」里没有 2025 年数据，同比不可算</b><br>')+
         '环比：销售 <b>'+sf(k.sp_mom_sa)+'</b> · 毛利 <b>'+sf(k.sp_mom_ga)+'</b>');
}
function renderChips(){
  document.getElementById('groups').innerHTML=GROUPS.map(g=>
    '<span class="chip '+(on.has(g.k)?'on':'')+'" data-g="'+g.k+'">'+g.t+'</span>').join('');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const g=c.dataset.g; if(on.has(g)){ if(on.size>1) on.delete(g); } else on.add(g); renderChips(); render();
  });
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{dim=b.dataset.d; render();});
document.getElementById('q').oninput=e=>{q=e.target.value; render();};
function renderMeta(){
  document.getElementById('metaBar').innerHTML=
    '<span class="f">平台 <select><option>'+D.meta.platform+'</option></select></span>'+
    '<span class="f"><i>国家</i><select id="selCountry">'+COUNTRIES.map(c=>
      '<option value="'+c+'"'+(c===D.meta.country?' selected':'')+'>'+c+'</option>').join('')+'</select></span>'+
    '<span class="f">月份 <b id="moVal">'+mo+'</b></span>'+
    '<span class="f">业务组 <b>'+D.meta.biz+'</b></span>'+
    '<span class="f">币种 <b>'+D.meta.currency+'</b></span>'+
    '<span class="f">口径日 <b>'+D.meta.rd+'</b></span>'+
    '<span class="f">数据源 <b>目标完成进度</b></span>'+
    '<span class="f">同比基数 <b>'+(D.meta.has_ly?'2025-11 全月':'无（'+D.meta.country+'缺 2025 数据）')+'</b></span>'+
    '<span class="f">快照 <b>'+D.meta.snapshot+'</b></span>';
  const sc=document.getElementById('selCountry');
  if(sc) sc.onchange=e=>{
    D=ALL[e.target.value]; mo=D.meta.cur; buF=''; open=new Set();
    renderMeta(); render();
  };
}
renderMeta();
function renderNote(){document.getElementById('note').innerHTML=
  '<b>口径：</b>金额 '+D.meta.currency+'（原表 CNY × '+D.meta.fx.toFixed(3)+
  (D.meta.country==='巴西'?'，1 CNY ≈ 0.802 BRL，取自巴西毛利监控 2026-11-15 当周「原币 ÷ 审计」中位数':'')+'）；达成率 = Σ达成 ÷ Σ目标；'+
  '<b>毛利率（顶部卡片）= Σ三 BU 毛利额达成 ÷ Σ三 BU 销售额达成</b>，固定只取 <b>衣物收纳BU + 宠物用品BU + 户外休闲BU</b>（本月覆盖全组销售额的 '+pf(M().kpi.gm_cov)+'），不是全组大合并行的直接相除；毛利率同比的 25 年基数也按同样三条 BU 汇总。<br>'+
  '<b>时间进度：</b>'+
  (M().base.full
    ? '当前查看 <b>'+mo+'</b> 为<b>完整自然月</b>，销售与毛利时间进度均按 <b>100%</b> 计。'
    : '销售额截止 <b>T-2（'+D.meta.sales_cut.slice(5)+'）</b>→ <b>'+D.meta.sales_day+'/'+D.meta.month_days+' = '+pf(MT().s)+'</b>；'+
      '毛利额<b>每周六取数</b>，最新快照 <b>'+D.meta.gross_cut.slice(5)+'</b> → <b>'+D.meta.gross_day+'/'+D.meta.month_days+' = '+pf(MT().g)+'</b>。')+
  '两张达成率分别对照各自基准判红绿，基准不是 100%。'+(M().base.full?'':'<b class="warn">若 BI 达成额尚未更新到该截止日，达成率会被低估</b>——本期按 10 月日均实测反推约 '+pf(D.meta.eff_tp)+'。')+'<br>'+
  '<b>配色（三档，全部达成率字段统一适用）：</b>达成率 <b style="color:#15803d">≥ 时间进度 → 绿色</b>；<b style="color:#a16207">≥ 时间进度的一半 → 黄色</b>；<b style="color:#b91c1c">＜ 时间进度的一半 → 红色</b>。'+
  '本期销售基准 '+pf(MT().s)+'（黄线 '+pf(MT().s/2)+'）、毛利基准 '+pf(MT().g)+'（黄线 '+pf(MT().g/2)+'）。'+
  '覆盖范围：顶部 KPI 卡、每个维度的每一行（含<b>合计行</b>）、三级分类维度两列「达成÷BU目标」、以及展开明细里每个三级分类的两项达成率（销售额按销售基准、毛利额按毛利基准，两套基准各判各的）。<br>'+
  '<b>同环比（同一时间进度，按你给的公式）：</b>'+
  '同比 =（本期累计达成 − 去年同月<b>全月</b>达成 × 时间进度）÷（去年同月全月达成 × 时间进度）；'+
  '环比 =（本期累计达成 − 上月<b>全月</b>达成 × 时间进度）÷（上月全月达成 × 时间进度）。'+
  '销售额用 T-2 进度、毛利额用最新周六进度；当前 <b>'+mo+'</b> 的销售基准 <b>'+pf(MT().s)+'</b>、毛利基准 <b>'+pf(MT().g)+'</b>。'+
  (M().base.full?'（完整月按 100% 计）':'')+'<br>'+
  '<b>基数（CNY 原值，便于与 BI 逐位核对）：</b>本期 '+mo+' 销售 <b>'+n2(M().base.cur_rev)+'</b>、毛利 <b>'+n2(M().base.cur_gp)+'</b>；'+
  '上月 '+M().base.prev_month+' 全月 销售 '+n2(M().base.prev_rev)+'、毛利 '+n2(M().base.prev_gp)+'。'+
  (D.meta.has_ly
    ? '去年 '+M().base.ly_month+' 全月 销售 '+n2(M().base.ly_rev)+'、毛利 '+n2(M().base.ly_gp)+'。'+
      '例：销售额同比 =（'+n2(M().base.cur_rev)+' − '+n2(M().base.ly_rev)+'×'+pf(MT().s)+'）÷（'+n2(M().base.ly_rev)+'×'+pf(MT().s)+'）。'
    : '（'+D.meta.country+' 无去年同月数据，同比一栏留空。）')+
  '<b>环比算式：</b>销售 =（'+n2(M().base.cur_rev)+' − '+n2(M().base.prev_rev)+'×'+pf(MT().s)+'）÷（'+n2(M().base.prev_rev)+'×'+pf(MT().s)+'）'+
  ' = '+sf(M().kpi.sp_mom_sa)+'；毛利 =（'+n2(M().base.cur_gp)+' − '+n2(M().base.prev_gp)+'×'+pf(MT().g)+'）÷（'+n2(M().base.prev_gp)+'×'+pf(MT().g)+'）'+
  ' = '+sf(M().kpi.sp_mom_ga)+'。<br>'+
  '<b>毛利率口径：</b>「26年毛利率达成」= 本期毛利达成 ÷ 本期销售达成；「25年毛利率达成」= 去年同月<b>全月</b>毛利率（基数同乘时间进度，比例不变），两者之差即毛利率同比。<br>'+
  '<b>数据源：</b>全部金额与比率取自帆软 BI <b>「目标完成进度(权限版)」</b>，本站点筛选下 ' + D.meta.total + ' 条明细' +
  (D.meta.country==='墨西哥'
    ? '（项目标准表 std_目标达成_BU产品组三级四级.csv）；同比基期 2025 全年由同一报表按月补拉（pull_yoy_full.py），与本期同源同口径。'
    : '（工作区自有 data/std_目标达成_BR.csv，由 pull_br.py 按月补拉，<b>不改动项目标准表</b>）；巴西在该报表里<b>没有 2025 年数据</b>，故同比不可算，只能看环比与达成。') +
  '<br>'+
  '<b>「达成 ÷ BU目标」（仅三级分类维度）：</b>该三级分类的达成 ÷ 其<b>所属 BU 的目标</b>，用来判断单个类目对 BU 目标的贡献度。' +
  '例：宠物毯属宠物用品BU → 宠物毯销售额达成 ÷ 宠物用品BU销售额目标。分母是整个 BU 的目标、不是类目自己的目标，所以数值通常远小于同一行的「达成率」。<br>'+
  '<b>映射口径：</b>负责人归属严格按桌面「墨西哥 项目负责人.xlsx」' + D.meta.mapped + ' 条（按三级分类关联，<b>两国共用同一张映射</b>）；' +
  'BU / 产品组以 BI 在「拉美收纳宠户组」筛选下的结果为准' +
  (D.meta.conflict.length
    ? '，因此 ' + D.meta.conflict.join('、') + ' 归入 ' + D.meta.conflict_bu.join('/') +
      '（映射表原写家具BU，按确认口径不采用）。'
    : '。') + '<br>'+
  '<b>月份切换：</b>右上「月份」标签可切到历史月份（'+D.meta.months[0]+' 起）。查看当月用 T-2 / 周六的时间进度；查看历史完整月时达成额已是整月，时间进度按 <b>100%</b> 计，此时的同比/环比即「完整月对完整月」。<br>'+  '<b>BU 筛选（仅三级分类维度）：</b>可按 BU 只保留该 BU 下的三级分类，用来单独看某条 BU 的类目结构。<br>'+  '<b>映射覆盖：</b>映射表 ' + D.meta.mapped + ' 条' +
  (D.meta.extra_mapped ? ' + 脚本补充 ' + D.meta.extra_mapped + ' 条（Excel 未收录）' : '') +
  '，关联本期 ' + D.meta.lv3 + ' 个三级类目' +
  (D.meta.unmapped.length
    ? '，其中 <b class="warn">' + D.meta.unmapped.length + ' 个未映射（' + D.meta.unmapped.join('、') +
      '，销售目标合计 ' + nf(D.meta.unmapped_st) + ' ' + D.meta.currency + '）</b>，在负责人维度显示为「未分配」。'
    : '，100% 覆盖。');
}
renderChips(); render();
</script>
